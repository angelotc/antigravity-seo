name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Resolve release version
        id: version
        run: |
          # Strip the leading "v" from the pushed tag (or workflow_dispatch's
          # ref) so the CLI's `version` output matches plugin.json/marketplace.json.
          ref="${GITHUB_REF#refs/tags/}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Build Multi-Platform Binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          targets=(
            "linux/amd64/seo-engine-linux-amd64"
            "linux/arm64/seo-engine-linux-arm64"
            "darwin/amd64/seo-engine-darwin-amd64"
            "darwin/arm64/seo-engine-darwin-arm64"
            "windows/amd64/seo-engine-windows-amd64.exe"
          )
          for target in "${targets[@]}"; do
            IFS="/" read -r goos goarch binary <<< "$target"
            echo "Building for $goos/$goarch -> dist/$binary"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build \
              -trimpath -ldflags="-s -w -X main.Version=${VERSION}" \
              -o "dist/$binary" ./cmd/seo-engine
          done

          # Checksums
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*
          generate_release_notes: true
