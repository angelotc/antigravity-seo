name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Multi-Platform Binaries
        run: |
          mkdir -p dist
          targets=(
            "linux/amd64/seo-engine-linux-amd64"
            "linux/arm64/seo-engine-linux-arm64"
            "darwin/amd64/seo-engine-darwin-amd64"
            "darwin/arm64/seo-engine-darwin-arm64"
            "windows/amd64/seo-engine-windows-amd64.exe"
          )
          for target in "${targets[@]}"; do
            IFS="/" read -r goos goarch binary <<< "$target"
            echo "Building for $goos/$goarch -> dist/$binary"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build \
              -trimpath -ldflags="-s -w" \
              -o "dist/$binary" ./cmd/seo-engine
          done

          # Checksums
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
